<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Структурный прототип одностраничного сайта по схеме заказчицы.">
  <title>Сайт-визитка · Прототип структуры</title>
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <aside class="prototype-note">Прототип структуры <span>Тексты и изображения временные</span></aside>
  <header class="site-header container">
    <a class="brand" href="#" id="brand">Название компании</a>
    <div class="header-contacts" id="header-contacts"></div>
  </header>
  <main id="main">
    <div class="container">
      <div class="hero-image" id="hero-image"></div>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title"></h1>
        <div class="intro-copy" id="intro-copy"></div>
      </section>
    </div>
    <div id="sections"></div>
  </main>
  <footer class="site-footer container">
    <div><p class="footer-brand" id="footer-brand"></p><div id="footer-contacts"></div></div>
    <nav class="social-links" aria-label="Социальные сети" id="social-links"></nav>
  </footer>
  <dialog class="lightbox" id="lightbox" aria-label="Просмотр изображения">
    <button class="lightbox-close" type="button" aria-label="Закрыть просмотр">×</button>
    <div id="lightbox-image"></div>
    <p id="lightbox-caption"></p>
  </dialog>
</body>
</html>
